<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;800;900&family=Heebo:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">

<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center;">

  <div class="paper-sheet paper-sheet-crops" style="max-width: 560px; width: 100%; padding: 48px 32px; box-shadow: var(--shadow-floating);">
    <img src="assets/images/logo.jpg" alt="TypesetOK Logo" width="56" height="56" style="margin: 0 auto 20px auto; border-radius: 8px;">
    
    <div style="font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--color-brand-blue); margin-bottom: 8px;">
      שגיאה 404 • PAGE NOT FOUND

    <h1 style="font-size: var(--font-size-3xl); font-weight: 800; color: var(--color-brand-navy); margin-bottom: 16px;">

    <p style="font-size: 16px; color: var(--color-ink-secondary); line-height: 1.6; margin-bottom: 28px;">

    </p>

    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="./" class="btn btn-primary btn-lg">
        <span>חזרה לדף הבית</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <a href="https://github.com/TypesetOK/website" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-lg">
        מאגר ה-GitHub
      </a>
    </div>
  </div>

  <div style="margin-top: 24px; font-family: var(--font-mono); font-size: 11px; color: var(--color-ink-muted);">
    TypesetOK Desktop Publishing System • SI 6100 &amp; ISO 15930
